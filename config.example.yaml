# 复制此文件到 ~/.hrids/config.yaml 并填入你的配置
# 完整字段说明见 docs/AGENT.md，或运行 hrids-agent --help
# 所有模型 ID 均可在 src/core/providers/builtin/ 下的各平台 YAML 中查阅

# 大语言模型（主对话引擎，必须配置）
# 同平台内按 models 顺序重试，全部失败后切换下一平台
llm:
  fallbacks:
    - provider: xiaomi
      apiKey: tp-cs8mlagf1xrhy9hxut43nkbdu7rtbzazqzqo3r0el9qocy77
      models:
        - mimo-v2-pro
    - provider: aliyun
      apiKey: sk-8d3b65698c8f40a3a9c542c2123e8502
      models:
        - deepseek-v4-flash
        - qwen3.5-35b-a3b
        - qwen3.6-flash-2026-04-16
        - qwen3.6-35b-a3b
        - qwen3.5-plus-2026-04-20
        - qwen3.6-max-preview
        - kimi-k2.6
        - qwen3.6-flash
        - MiniMax-M2.5
        - deepseek-v4-pro

# 视觉模型（图像理解，可选；未配置则复用 llm 中支持图片的模型）
vision:
  fallbacks:
    - provider: aliyun
      apiKey: sk-54336ea55e89493688c7819e0c61a95c
      models:
        - qwen-vl-plus-latest
        - qwen-vl-max

# 语音合成（TTS，可选）
tts:
  fallbacks:
    - provider: xiaomi
      apiKey: sk-xxxxxxxx
      models:
        - mimo-v2.5-tts
        - mimo-v2-tts
    - provider: minimax
      apiKey: sk-xxxxxxxx
      models:
        - speech-2.8-hd
        - speech-2.8-turbo

# 语音识别（STT，可选）
stt:
  fallbacks:
    - provider: groq
      apiKey: gsk_xxxxxxxx
      models:
        - whisper-large-v3

# 向量模型（语义检索，可选；未配置则降级 TF-IDF，无需 API）
embedding:
  fallbacks:
    - provider: zhipu
      apiKey: xxxxxxxxxxx
      models:
        - embedding-3
        - embedding-2
  dimensions: 1024

# 向量存储后端。backend: sqlite（默认，内置）| pgvector | seekdb
vectorStore:
  backend: sqlite

# Agent 运行时行为配置
agent:
  model: qwen3.6-flash-2026-04-16
  permissionMode: plan
  maxTokens: 8096
  maxTurns: 50
  memoryCondense: false
  # 自动压缩上下文的 token 阈值（超过后用 LLM 生成摘要，替换早期历史）
  # 设为 0 可禁用自动压缩，手动用 /compact 命令触发
  autoCompactThreshold: 100000
  autoDistillSkill: false
  autoPruneSessions: true
  pruneKeepCount: 50
  pruneMaxAgeDays: 90

# 命令安全分析（在 bash/PowerShell 执行前检测危险模式）
commandSafety:
  enabled: true
  # 阻断等级：low | medium | high | critical
  # 等于或高于此等级的命令将被拒绝执行
  blockLevel: high
  # 额外的自定义危险正则（匹配则拒绝）
  # extraPatterns:
  #   - "rm\\s+-rf\\s+/tmp/important"

# 网络访问策略（控制 web_fetch / web_search 可访问的域名）
networkPolicy:
  enabled: true
  # 默认动作：allow（仅拦截黑名单）| deny（仅放行白名单）
  defaultAction: allow
  # 白名单（defaultAction=deny 时生效，仅允许这些域名）
  # allowedDomains:
  #   - "*.example.com"
  #   - "api.github.com"
  # 黑名单（defaultAction=allow 时生效，拒绝这些域名）
  # blockedDomains:
  #   - "malicious-site.com"

# Gateway 模式（HTTP + WebSocket 服务）。启动：hrids-agent --gateway
gateway:
  port: 3282
  host: 127.0.0.1
  token: ""
  # 用户列表（配置后前端显示用户名/密码登录界面）
  users:
    - username: admin
      password: "123456"

# 日志级别：debug | info | warn | error
logging:
  level: info
  theme: default

# AI Skills 社区（https://skillhub.cn）
skillHub:
  url: https://skillhub.cn
  apiBase: https://api.skillhub.cn

# 自定义提供商 —— 接入任意 OpenAI / Anthropic 兼容接口
# 配置后可在 llm.fallbacks 中通过 name 引用，也可通过 modelPrefixes 自动识别
# customProviders:
#   - name: MyLLM
#     baseUrl: https://my-llm.example.com/v1
#     transport: openai_chat              # openai_chat（默认）| anthropic_messages
#     apiKeyEnvVar: MY_LLM_API_KEY        # 推荐：从环境变量读取 Key
#     modelPrefixes: [myllm-, my-model]   # 可选：模型名前缀，用于自动推断提供商
#     nativeWebSearch: false
#     models:                             # 可选：完整模型参数（与 builtin YAML 格式一致）
#       myllm-7b:
#         contextWindow: 32768
#         maxOutputTokens: 4096
#         supportsToolUse: true
#         description: 我的 7B 模型
#       myllm-70b:
#         contextWindow: 131072
#         maxOutputTokens: 16384
#         supportsImage: true
#         supportsToolUse: true
#         description: 我的 70B 多模态模型

# MCP 服务器。也可单独维护 ~/.hrids/mcp.json（兼容 Claude Desktop 格式）
# mcpServers:
#   - name: filesystem
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#     env: {}

# 多智能体配置。子智能体通过 agent 工具派生，支持按角色分配不同模型和权限
multiAgent:
  globalMaxConcurrent: 10
  defaultMaxTurns: 30
  defaultTimeoutMs: 300000
  autoSelectProfiles: true
  allowRecursiveAgent: false
  # 内联 profile 示例：代码审查专家
  # profiles:
  #   - name: code-reviewer
  #     description: 审查代码质量、安全性和最佳实践
  #     model: claude-sonnet-4-6
  #     provider: anthropic
  #     allowedTools: [file_read, grep, glob]
  #     maxTurns: 15
  #     autoSelectable: true
  profileDirs: []

# 子智能体工具权限策略
toolPermissions:
  defaultDenyList:
    - todo_write
    - todo_update
    - todo_append
    - todo_reset
  allowMcpTools: false

# Web 搜索配置
webSearch:
  # 搜索引擎：searxng（默认）| mojeek
  engine: searxng
  # SearXNG 实例地址（engine=searxng 时使用）
  endpoint: https://xng.hrids.com
