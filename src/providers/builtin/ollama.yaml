# Ollama（本地模型）
name: Ollama
transport: openai_chat
apiKeyEnvVars: []
defaultBaseUrl: http://localhost:11434/v1
baseUrlEnvVar: OLLAMA_BASE_URL

nativeWebSearch: false

# 本地模型无固定列表，以下为常用模型的参考参数
# 用户可通过 ollama pull 下载任意模型，此处列出常见型号供自动识别
models:
