version: '3.8'

services:
  hrids-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hrids-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount config file
      - ./config.yaml:/app/config.yaml:ro
      # Persist data (SQLite database, etc.)
      - hrids-data:/app/data
    environment:
      - NODE_ENV=production
      - HRIDS_DATA_DIR=/app/data
    command: ["--gateway"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  hrids-data:
    driver: local
