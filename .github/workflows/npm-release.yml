name: NPM Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch   # 0.1.0 -> 0.1.1
          - minor   # 0.1.0 -> 0.2.0
          - major   # 0.1.0 -> 1.0.0
          - prepatch # 0.1.0 -> 0.1.1-0
      preflight_only:
        description: '仅运行预检查（不实际发布）'
        required: true
        default: true
        type: boolean
      npm_dist_tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - next

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    if: inputs.preflight_only == true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "No lint script"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $PKG_VERSION"

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Preview publish (dry-run)
        run: npm publish --dry-run

  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    needs: preflight
    if: inputs.preflight_only == false
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bump version
        run: |
          npm version ${{ inputs.release_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Check if already published
        run: |
          if npm view hrids-agent@${{ env.NEW_VERSION }} version >/dev/null 2>&1; then
            echo "Version ${{ env.NEW_VERSION }} already published!"
            exit 1
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Git tag
        run: |
          git tag v${{ env.NEW_VERSION }}
          git push origin v${{ env.NEW_VERSION }}

      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ inputs.npm_dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.npm_dist_tag != 'latest' }}
