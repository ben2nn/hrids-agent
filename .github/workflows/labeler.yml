name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 文件路径标签
  path-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  # PR 大小标签
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply size label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) return;

            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];

            // 获取 PR 文件列表
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }
            );

            // 计算变更行数（排除 lock 文件和自动生成的文件）
            const excludedFiles = new Set([
              'package-lock.json',
              'pnpm-lock.yaml',
              'yarn.lock',
            ]);

            let totalChanges = 0;
            for (const file of files) {
              if (excludedFiles.has(file.filename)) continue;
              if (file.filename.endsWith('.lock')) continue;
              totalChanges += (file.additions || 0) + (file.deletions || 0);
            }

            // 确定大小标签
            let targetLabel;
            if (totalChanges < 10) {
              targetLabel = 'size/XS';
            } else if (totalChanges < 50) {
              targetLabel = 'size/S';
            } else if (totalChanges < 200) {
              targetLabel = 'size/M';
            } else if (totalChanges < 500) {
              targetLabel = 'size/L';
            } else {
              targetLabel = 'size/XL';
            }

            // 获取当前标签
            const currentLabels = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              }
            );

            const currentLabelNames = currentLabels.map(l => l.name);
            const labelsToAdd = [];
            const labelsToRemove = [];

            // 确定需要添加和移除的标签
            if (!currentLabelNames.includes(targetLabel)) {
              labelsToAdd.push(targetLabel);
            }

            for (const label of sizeLabels) {
              if (label !== targetLabel && currentLabelNames.includes(label)) {
                labelsToRemove.push(label);
              }
            }

            // 添加标签
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                labels: labelsToAdd,
              });
            }

            // 移除标签
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  name: label,
                });
              } catch (error) {
                // 标签可能不存在，忽略错误
                if (error.status !== 404) throw error;
              }
            }

            console.log(`PR #${pullRequest.number}: ${totalChanges} changes -> ${targetLabel}`);
