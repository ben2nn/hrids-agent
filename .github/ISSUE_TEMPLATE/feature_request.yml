name: 功能请求
description: 提出新功能或改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能请求！请详细描述您的需求，帮助我们更好地理解和评估。

  - type: textarea
    id: summary
    attributes:
      label: 功能概述
      description: 一句话描述您想要的功能
      placeholder: 例如：支持通过环境变量配置 LLM Provider
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个功能解决什么问题？当前行为为什么不够好？
      placeholder: |
        当前只能通过配置文件设置 LLM Provider，但在 Docker/CI 环境中，
        通过环境变量配置更加方便和安全。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述您期望的实现方式和行为
      placeholder: |
        支持以下环境变量：
        - HRIDS_LLM_PROVIDER=anthropic
        - HRIDS_LLM_API_KEY=sk-xxx
        - HRIDS_LLM_MODEL=claude-sonnet-4-20250514
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您考虑过的其他解决方案
      placeholder: 使用 .env 文件、使用配置文件挂载等

  - type: textarea
    id: impact
    attributes:
      label: 影响分析
      description: |
        描述这个功能的影响：
        - 受益用户/场景
        - 优先级 (急需 / 重要 / 一般 / 锦上添花)
        - 使用频率
      placeholder: |
        受益场景：Docker 部署、CI/CD 集成
        优先级：重要
        使用频率：所有容器化部署

  - type: textarea
    id: examples
    attributes:
      label: 参考示例
      description: 提供相关的参考实现或截图
      placeholder: 类似项目 xxx 的实现方式

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息
      placeholder: 技术约束、兼容性要求等
